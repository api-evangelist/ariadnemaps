description: Ariadnemaps provides a privacy‑first people counting platform that uses hybrid fusion of phone‑signal sensing and time‑of‑flight
  depth sensors to deliver sub‑meter accuracy without cameras or personal data. The solution offers real‑time occupancy monitoring, queue management,
